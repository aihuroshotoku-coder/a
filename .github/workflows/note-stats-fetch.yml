name: note stats fetch
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch note stats
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: |
          mkdir -p data/raw
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          for URL in \
            "https://note.com/api/v1/stats/pv?filter=all&page=1&sort=pv" \
            "https://note.com/api/v2/stats/pv?filter=all&page=1&sort=pv" \
            "https://note.com/api/v3/stats/pv?filter=all&page=1&sort=pv"
          do
            RESP=$(curl -s -H "Cookie: _note_session_v5=$NOTE_SESSION_COOKIE" "$URL")
            if echo "$RESP" | head -c1 | grep -q '[{[]'; then
              echo "$RESP" > "data/raw/${DATE}.json"
              echo "source_url: $URL" > "data/raw/${DATE}.meta"
              break
            fi
          done
          if [ ! -f "data/raw/${DATE}.json" ]; then
            echo '{"error":"fetch_failed_or_cookie_expired"}' > "data/raw/${DATE}.json"
          fi
      - name: Commit
        run: |
          git config user.name "note-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "stats: $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "no changes"
          git push
